# ==============================================================================
# DEVICE PRO — Production NGINX Reverse Proxy Configuration
# Target Domain: devicepro.ng (and www.devicepro.ng)
# ==============================================================================

# Upstream Node.js application cluster
upstream devicepro_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=devicepro_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=devicepro_auth_limit:10m rate=5r/s;

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name devicepro.ng www.devicepro.ng;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devicepro.ng www.devicepro.ng;

    # SSL/TLS Certificates (Managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/devicepro.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devicepro.ng/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression Configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Root Directory for Static Assets
    root /var/www/devicepro/public;

    # 1. Static Assets Caching Directives
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
        try_files $uri @backend;
    }

    # 2. API Endpoints with Rate Limiting
    location /api/ {
        limit_req zone=devicepro_api_limit burst=20 nodelay;
        
        proxy_pass http://devicepro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 3. Authentication Rate Limiting
    location /api/auth/ {
        limit_req zone=devicepro_auth_limit burst=5 nodelay;
        
        proxy_pass http://devicepro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Default Application Routing
    location / {
        try_files $uri $uri.html @backend;
    }

    # 5. Reverse Proxy Fallback
    location @backend {
        proxy_pass http://devicepro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
