<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | DEVICE PRO — Clean Energy Solutions Nigeria</title>
  <meta name="description" content="Set a new secure password for your DEVICE PRO customer account.">
  <link rel="icon" type="image/svg+xml" href="/images/logo-mark.svg">
  <link rel="stylesheet" href="/css/auth.css?v=2">
  <script defer src="/js/lucide.min.js"></script>
  <script defer src="/js/lucide-init.js"></script>
  <script defer src="/js/reset-password.js?v=2"></script>
</head>
<body class="auth-page">

  <!-- Top-Left Corner Geometric Accent -->
  <svg class="auth-corner-accent auth-corner-top-left" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <polygon points="0,0 120,0 0,120" fill="#0866D9" />
    <polygon points="0,70 170,0 135,0 0,135" fill="#FFBF00" />
    <polygon points="0,110 200,0 170,0 0,170" fill="#073B82" />
  </svg>

  <!-- Bottom-Right Corner Geometric Accent -->
  <svg class="auth-corner-accent auth-corner-bottom-right" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <polygon points="200,90 200,60 60,200 90,200" fill="#FFBF00" />
    <polygon points="200,140 200,95 95,200 140,200" fill="#0866D9" />
    <polygon points="200,200 200,145 145,200" fill="#073B82" />
  </svg>

  <!-- Main Reset Card -->
  <main class="auth-card-container">
    <div class="auth-card" id="auth-card">
      
      <!-- Logo Header -->
      <header class="auth-brand-header">
        <a href="/" class="auth-brand-logo-link" aria-label="DEVICE PRO Homepage">
          <img src="/images/devicepro-original-transparent.png" alt="DEVICE PRO Logo" class="auth-brand-logo-img">
        </a>
        <p class="auth-brand-tagline">Powering Your Devices. Enriching Your Life.</p>
      </header>

      <!-- Heading -->
      <h1 class="auth-title">Set New Password</h1>
      <p class="auth-subtitle">Create a new secure password for your DEVICE PRO account.</p>

      <!-- Feedback Alert -->
      <div id="auth-alert" class="auth-alert" role="alert" aria-live="polite">
        <i data-lucide="alert-circle" id="alert-icon" style="flex-shrink: 0; width: 18px; height: 18px;"></i>
        <span id="alert-message"></span>
      </div>

      <!-- Reset Password Form -->
      <form id="reset-form" class="auth-form" novalidate>
        
        <input type="hidden" id="reset-token" name="token">

        <!-- New Password Field -->
        <div class="auth-field-group">
          <label for="password" class="auth-label">New Password</label>
          <div class="auth-input-wrapper with-action" id="password-wrapper">
            <span class="auth-input-icon" aria-hidden="true">
              <i data-lucide="lock"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="auth-input" 
              placeholder="Enter new password (min. 8 characters)" 
              required 
              autocomplete="new-password"
              aria-describedby="password-error"
            >
            <button 
              type="button" 
              class="btn-toggle-password" 
              id="btn-toggle-password" 
              aria-label="Show password" 
              aria-pressed="false"
              title="Show or hide password"
            >
              <i data-lucide="eye" id="password-eye-icon"></i>
            </button>
          </div>
          <span id="password-error" class="auth-field-error" role="alert"></span>
        </div>

        <!-- Confirm New Password Field -->
        <div class="auth-field-group">
          <label for="confirm-password" class="auth-label">Confirm New Password</label>
          <div class="auth-input-wrapper with-action" id="confirm-password-wrapper">
            <span class="auth-input-icon" aria-hidden="true">
              <i data-lucide="lock"></i>
            </span>
            <input 
              type="password" 
              id="confirm-password" 
              name="confirmPassword" 
              class="auth-input" 
              placeholder="Re-enter your new password" 
              required 
              autocomplete="new-password"
              aria-describedby="confirm-password-error"
            >
            <button 
              type="button" 
              class="btn-toggle-password" 
              id="btn-toggle-confirm-password" 
              aria-label="Show confirm password" 
              aria-pressed="false"
              title="Show or hide confirm password"
            >
              <i data-lucide="eye" id="confirm-eye-icon"></i>
            </button>
          </div>
          <span id="confirm-password-error" class="auth-field-error" role="alert"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-submit" id="btn-submit">
          <span class="btn-text-content">Update Password &rarr;</span>
          <span class="auth-spinner" aria-hidden="true"></span>
        </button>

      </form>

      <!-- Bottom Card Footer -->
      <footer class="auth-card-footer">
        Back to 
        <a href="/login.html" class="auth-card-footer-link">Sign In &rarr;</a>
      </footer>

    </div>

    <!-- Back to Store Link -->
    <a href="/" class="auth-back-link">&larr; Return to DEVICE PRO Store</a>

  </main>

</body>
</html>
