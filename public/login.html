<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | DEVICE PRO — Clean Energy Solutions Nigeria</title>
  <meta name="description" content="Sign in to your DEVICE PRO account to manage orders, solar consultation requests, and engineered installation tracking.">
  <link rel="icon" type="image/svg+xml" href="/images/logo-mark.svg">
  <link rel="stylesheet" href="/css/auth.css?v=2">
  <script defer src="/js/lucide.min.js"></script>
  <script defer src="/js/lucide-init.js"></script>
  <script defer src="/js/login.js?v=2"></script>
</head>
<body class="auth-page">

  <!-- Accessible Skip to Form Link -->
  <a href="#login-form" class="auth-back-link" style="position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden;" onfocus="this.style.position='static'; this.style.width='auto'; this.style.height='auto';">Skip to Login Form</a>

  <!-- Top-Left Corner Geometric Accent -->
  <svg class="auth-corner-accent auth-corner-top-left" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <polygon points="0,0 120,0 0,120" fill="#0866D9" />
    <polygon points="0,70 170,0 135,0 0,135" fill="#FFBF00" />
    <polygon points="0,110 200,0 170,0 0,170" fill="#073B82" />
  </svg>

  <!-- Bottom-Right Corner Geometric Accent -->
  <svg class="auth-corner-accent auth-corner-bottom-right" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <polygon points="200,90 200,60 60,200 90,200" fill="#FFBF00" />
    <polygon points="200,140 200,95 95,200 140,200" fill="#0866D9" />
    <polygon points="200,200 200,145 145,200" fill="#073B82" />
  </svg>

  <!-- Main Authentication Card -->
  <main class="auth-card-container">
    <div class="auth-card" id="auth-card">
      
      <!-- Logo Header -->
      <header class="auth-brand-header">
        <a href="/" class="auth-brand-logo-link" aria-label="DEVICE PRO Homepage">
          <img src="/images/devicepro-original-transparent.png" alt="DEVICE PRO Logo" class="auth-brand-logo-img">
        </a>
        <p class="auth-brand-tagline">Powering Your Devices. Enriching Your Life.</p>
      </header>

      <!-- Welcome Heading -->
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your DEVICE PRO account to continue.</p>

      <!-- Dynamic Feedback Alert -->
      <div id="auth-alert" class="auth-alert" role="alert" aria-live="polite">
        <i data-lucide="alert-circle" id="alert-icon" style="flex-shrink: 0; width: 18px; height: 18px;"></i>
        <span id="alert-message"></span>
      </div>

      <!-- Google Authentication Button -->
      <button type="button" class="btn-google-auth" id="btn-google-auth" aria-label="Continue with Google">
        <svg class="google-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- OR Divider -->
      <div class="auth-divider" aria-hidden="true">
        <span class="auth-divider-text">OR</span>
      </div>

      <!-- Manual Login Form -->
      <form id="login-form" class="auth-form" novalidate>
        
        <!-- Email Field -->
        <div class="auth-field-group">
          <label for="email" class="auth-label">Email Address</label>
          <div class="auth-input-wrapper" id="email-wrapper">
            <span class="auth-input-icon" aria-hidden="true">
              <i data-lucide="mail"></i>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="auth-input" 
              placeholder="Enter your email address" 
              required 
              autocomplete="email"
              aria-describedby="email-error"
            >
          </div>
          <span id="email-error" class="auth-field-error" role="alert"></span>
        </div>

        <!-- Password Field -->
        <div class="auth-field-group">
          <label for="password" class="auth-label">Password</label>
          <div class="auth-input-wrapper with-action" id="password-wrapper">
            <span class="auth-input-icon" aria-hidden="true">
              <i data-lucide="lock"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="auth-input" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
              aria-describedby="password-error"
            >
            <button 
              type="button" 
              class="btn-toggle-password" 
              id="btn-toggle-password" 
              aria-label="Show password" 
              aria-pressed="false"
              title="Show or hide password"
            >
              <i data-lucide="eye" id="password-eye-icon"></i>
            </button>
          </div>
          <span id="password-error" class="auth-field-error" role="alert"></span>
        </div>

        <!-- Options: Remember Me & Forgot Password -->
        <div class="auth-options-row">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="remember-me" name="remember" class="auth-checkbox">
            <span>Remember me</span>
          </label>
          <a href="/forgot-password.html" class="auth-link">Forgot your password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-submit" id="btn-submit">
          <span class="btn-text-content">Sign In &rarr;</span>
          <span class="auth-spinner" aria-hidden="true"></span>
        </button>

      </form>

      <!-- Bottom Card Footer (Link to Register) -->
      <footer class="auth-card-footer">
        Don't have an account? 
        <a href="/register.html" class="auth-card-footer-link">Create Account &rarr;</a>
      </footer>

    </div>

    <!-- Back to Store Link -->
    <a href="/" class="auth-back-link">&larr; Return to DEVICE PRO Store</a>

  </main>

  <script src="/js/animations.js"></script>
</body>
</html>
